name: Release

on:
  push:
    branches:
    - release

jobs:
  release:
    name: Release Package
    runs-on: ubuntu-latest
    environment: RELEASE
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v6
    - name: Use PNPM
      uses: pnpm/action-setup@v6
      with:
        # temporarily stick to the 11.11.0 because 11.12.0 has issue in Action
        # https://github.com/pnpm/action-setup/issues/276
        version: 11.11.0
        cache: true
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Code check
      run: npm run code-check
    - name: Build ping-react-native
      run: |
        npm run package-builder
    - name: Release to npm registry
      run: |
        pnpm publish --filter ping-react-native --access public --no-git-checks
